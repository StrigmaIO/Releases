name: Feature request
description: Suggest an improvement or a new feature for Strigma.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or workflow you want to improve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What have you tried, or how do you handle this today?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or references if helpful.

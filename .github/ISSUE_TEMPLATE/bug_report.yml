name: Bug report
description: Report something that is not working in Strigma.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Strigma version
      description: Find this in Settings → General → Updates.
      placeholder: 0.23.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS, Windows, or Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: Version number or distribution release
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Audio setup and plugins
      description: Include your audio interface, sample rate, buffer size, and plugin names/versions if relevant.
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, logs, or a sample project
      description: Attach anything that helps reproduce the problem.
